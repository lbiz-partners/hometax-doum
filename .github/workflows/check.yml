# 무료판 정합성 게이트 — push/PR마다 자동 실행. 실패 시 빨간 X로 표시.
# 핵심: 유료(Pro) 스킬이 무료 레포에 섞이는 실수 자동 차단.
name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 정합성 게이트 (유료 유출·면책·금지문구·junk·안전규칙 lint)
        run: node scripts/check.mjs
      - name: 미수금 회귀 테스트 (소진·선금·순액·취소·경계·역점검)
        run: node scripts/test-receivables.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 무료판 설치·번들·ZIP 원본 대조
        run: bash scripts/build.sh

  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Windows PowerShell 설치기 실행
        shell: powershell
        run: |
          .\install.ps1 --check
          $target = Join-Path $env:RUNNER_TEMP 'hometax-doum-skills'
          .\install.ps1 --target-dir $target
          $installed = @(Get-ChildItem -LiteralPath $target -Directory)
          if ($installed.Count -ne 6) {
            throw "Expected 6 installed skills, found $($installed.Count)."
          }
