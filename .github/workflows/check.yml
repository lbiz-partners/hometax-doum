# 무료판 정합성 게이트 — push/PR마다 자동 실행. 실패 시 빨간 X로 표시.
# 핵심: 유료(Pro) 스킬이 무료 레포에 섞이는 실수 자동 차단.
name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 버전 역행 차단 (직전 커밋·base 브랜치보다 낮은 VERSION 거부)
        env:
          GH_EVENT: ${{ github.event_name }}
          GH_BEFORE: ${{ github.event.before }}
          GH_BASE: ${{ github.base_ref }}
        run: |
          set -eu
          # 공백·CR 을 떼고 X.Y.Z 로 엄격 일치시킨다. 끝에 공백 한 칸이나 -rc1 이
          # 붙으면 비교가 조용히 꺼져 역행이 통과하던 구멍을 닫는다(13차 M-2 실측).
          strict() { printf '%s' "$1" | tr -d ' \t\r'; }
          new_v="$(strict "$(sed -n 's/^version: *//p' VERSION)")"
          [ -n "$new_v" ] || { echo "VERSION 을 읽지 못했습니다 — 거부"; exit 1; }
          case "$new_v" in
            *[!0-9.]*|*..*|.*|*.) echo "VERSION 표기가 X.Y.Z 가 아닙니다($new_v) — 거부"; exit 1 ;;
          esac
          # push 이벤트에서는 checkout 시점의 origin/main 이 방금 민 커밋 자신이라 비교가
          # 무의미하다(2026-09-19 적대적 리뷰 12차 High-1 실측). push 는 직전 커밋(before),
          # PR 은 base 브랜치와 비교한다.
          base=""
          if [ "${GH_EVENT:-}" = "pull_request" ]; then
            base="origin/${GH_BASE:-main}"
          elif [ -n "${GH_BEFORE:-}" ] && [ "${GH_BEFORE}" != "0000000000000000000000000000000000000000" ]; then
            base="${GH_BEFORE}"
          fi
          if [ -z "$base" ]; then
            echo "비교 기준을 정하지 못했습니다(첫 push 이거나 before 없음) — 버전 비교 생략"; exit 0
          fi
          if ! git rev-parse --verify -q "$base^{commit}" >/dev/null; then
            echo "비교 기준 $base 를 읽지 못했습니다 — 거부."
            echo "  강제푸시로 직전 커밋이 사라졌거나, checkout 의 fetch-depth 가 얕을 수 있습니다."
            exit 1
          fi
          old_v="$(strict "$(git show "$base:VERSION" 2>/dev/null | sed -n 's/^version: *//p' || true)")"
          if [ -z "$old_v" ]; then
            echo "비교 기준 $base 에 VERSION 이 없습니다 — 버전 비교 생략"; exit 0
          fi
          case "$old_v" in
            *[!0-9.]*|*..*|.*|*.) echo "비교 기준의 VERSION 표기가 X.Y.Z 가 아닙니다($old_v) — 거부"; exit 1 ;;
          esac
          if [ "$new_v" != "$old_v" ]; then
            lowest="$(printf '%s\n%s\n' "$new_v" "$old_v" | sort -t. -k1,1n -k2,2n -k3,3n | head -1)"
            if [ "$lowest" = "$new_v" ]; then
              echo "버전 역행 — $base 의 $old_v 보다 낮은 $new_v 는 배포를 되감습니다"; exit 1
            fi
          fi
          echo "버전 확인 OK: $base $old_v → $new_v"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 정합성 게이트 (유료 유출·면책·금지문구·junk·안전규칙 lint·공통 문단·업무 목록 생성)
        run: node scripts/check.mjs
      - name: 미수금 회귀 테스트 (소진·선금·순액·취소·경계·역점검)
        run: node scripts/test-receivables.mjs
      - name: 무료판 설치·번들·ZIP 원본 대조
        run: bash scripts/build.sh

  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Windows PowerShell 설치기 실행
        shell: powershell
        run: |
          .\install.ps1 --check
          if ($LASTEXITCODE -ne 0) { throw "Installer check failed with exit code $LASTEXITCODE." }
          $target = Join-Path $env:RUNNER_TEMP '홈택스 도움 skills'
          .\install.ps1 --target-dir $target
          if ($LASTEXITCODE -ne 0) { throw "Installer failed with exit code $LASTEXITCODE." }
          $installed = @(Get-ChildItem -LiteralPath $target -Directory)
          if ($installed.Count -ne 6) {
            throw "Expected 6 installed skills, found $($installed.Count)."
          }
